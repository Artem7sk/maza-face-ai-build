name: Build and test MAZA FACE AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Image name
        run: echo "image=ghcr.io/artem7sk/maza-face-ai" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: ./maza_face_ai
          file: ./maza_face_ai/Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          tags: |
            ghcr.io/artem7sk/maza-face-ai:0.1.1
            ghcr.io/artem7sk/maza-face-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ghcr.io/artem7sk/maza-face-ai:0.1.1

      - name: Image size
        run: |
          echo "=== SIZE ==="
          docker image inspect ghcr.io/artem7sk/maza-face-ai:0.1.1 \
            --format '{{.Size}}' | awk '{printf "%.1f MB (uncompressed)\n", $1/1024/1024}'

      - name: Verify models inside image
        run: |
          echo "=== MODELS in image ==="
          docker run --rm --entrypoint sh ghcr.io/artem7sk/maza-face-ai:0.1.1 -c \
            'ls -la /app/models && sha256sum /app/models/*.onnx'

      - name: Smoke run with hard container limits
        run: |
          echo "=== CONTAINER RUN: --cpus=1 --memory=512m --memory-swap=512m ==="
          mkdir -p /tmp/smokeout
          set +e
          docker run --rm \
            --cpus=1 --memory=512m --memory-swap=512m \
            --name maza-smoke \
            -v /tmp/smokeout:/out \
            --entrypoint python3 \
            ghcr.io/artem7sk/maza-face-ai:0.1.1 /app/main.py \
            > /tmp/smoke.stdout 2> /tmp/smoke.stderr
          RC=$?
          set -e
          echo "DOCKER_EXIT_CODE=$RC"
          echo "$RC" > /tmp/rc.txt
          echo "=== STDOUT ==="
          cat /tmp/smoke.stdout || true
          echo "=== STDERR (tail) ==="
          tail -40 /tmp/smoke.stderr || true
          echo "=== DOCKER STATS (peak-ish) ==="
          docker stats --no-stream --format '{{.MemUsage}} | {{.CPUPerc}}' maza-smoke 2>/dev/null || echo "(container already removed)"
          exit 0

      - name: Show results
        run: |
          echo "=== EXIT CODE: $(cat /tmp/rc.txt) ==="
          echo "=== JSON EVENTS ==="
          grep -E '^\{' /tmp/smoke.stdout || echo "(нет JSON в stdout)"

      - name: Assert limits applied and frames processed
        run: |
          echo "=== /tmp/smokeout ==="
          ls -la /tmp/smokeout || true
          python3 - <<'PY'
          import json, sys, os

          events = []
          ev_path = "/tmp/smokeout/events.jsonl"
          if os.path.isfile(ev_path):
              for line in open(ev_path, errors="replace"):
                  line = line.strip()
                  if line.startswith("{"):
                      try:
                          events.append(json.loads(line))
                      except Exception:
                          pass
          else:
              print("WARNING: events.jsonl not found, falling back to stdout")
              for line in open("/tmp/smoke.stdout", errors="replace"):
                  line = line.strip()
                  if line.startswith("{"):
                      try:
                          events.append(json.loads(line))
                      except Exception:
                          pass
          names = [e.get("event") for e in events]
          print("events:", names)

          rc = int(open("/tmp/rc.txt").read().strip() or 99)
          print("container exit code:", rc)

          def ev(name):
              for e in events:
                  if e.get("event") == name:
                      return e
              return None

          fail = []

          lim = ev("limits_applied")
          if not lim:
              fail.append("limits_applied event missing (fail-closed guard did not pass)")
          else:
              if lim.get("rlimit_as_bytes") != 536870912:
                  fail.append(f"RLIMIT_AS wrong: {lim.get('rlimit_as_bytes')}")
              if not lim.get("affinity_ok"):
                  fail.append("affinity not applied")
              print("limits:", json.dumps(lim))

          if not ev("opencv_ready"):
              fail.append("opencv_ready missing - OpenCV failed to load under RLIMIT_AS 512MB")
          if not ev("models_loaded"):
              fail.append("models_loaded missing - YuNet/SFace failed to load")

          frames = [e for e in events if e.get("event") == "frame"]
          print("frames processed:", len(frames))
          if len(frames) != 5:
              fail.append(f"expected 5 frames, got {len(frames)}")

          done = ev("done")
          if not done:
              fail.append("done event missing")
          else:
              print("DONE:", json.dumps(done))
              print(f"peak VmHWM: {done.get('vmhwm_kb')} kB")

          for f in frames:
              print(f"  {f.get('frame')}: faces={f.get('faces')} detect={f.get('detect_ms')}ms embed={f.get('embed_ms')}ms")

          if rc != 0:
              fail.append(f"container exited with code {rc}")

          if fail:
              print("\nFAILED:")
              for f in fail:
                  print(" -", f)
              sys.exit(1)
          print("\nALL CHECKS PASSED")
          PY
