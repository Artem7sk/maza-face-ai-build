name: "MAZA FACE AI"
version: "0.1.3"
slug: "maza_face_ai"
description: "Local face detection (YuNet) + recognition (SFace) on demand, fully offline"
url: "https://github.com/Artem7sk/maza-face-ai-build"
arch:
  - amd64
startup: application
boot: manual_only
init: false
image: "ghcr.io/artem7sk/maza-face-ai"
map:
  - media:ro
options:
  log_level: "info"
  max_runtime_sec: 60
  input_path: ""
  mode: "synthetic"
schema:
  log_level: "list(debug|info|warning)"
  max_runtime_sec: "int(10,300)"
  input_path: "str?"
  mode: "list(synthetic|file)"
